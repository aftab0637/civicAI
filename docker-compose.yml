version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: civicai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: civicai
    ports:
      - "5439:5432" # Mapped to non-standard port 5439 on host to avoid conflicts with any local PostgreSQL (5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/civicai
      - SECRET_KEY=supersecretkeyforjwttokengenerationchangeinproduction
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - civicai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - civicai_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  civicai_network:
    driver: bridge
